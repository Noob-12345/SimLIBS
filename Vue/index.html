<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/spectrum.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171b22" />
    <meta name="description" content="SimLIBS 光谱工作台 · 示意数据" />
    <title>SimLIBS · 光谱工作台</title>
    <style>
      #app{opacity:0;transition:opacity .18s ease}
      body[data-boot-ready=true] #app{opacity:1}
      .startup{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg,#f5f4f1);color:var(--text,#242933);font-family:var(--font-ui,"Microsoft YaHei UI","Microsoft YaHei","Segoe UI",system-ui,sans-serif);text-align:center;transition:opacity .18s ease}
      :root[data-theme=dark] .startup{background:var(--bg,#11151c);color:var(--text,#e8edf4)}
      .startup strong{display:block;font-size:24px;font-weight:600}
      .startup-visual{position:relative;width:180px;height:180px;margin:22px auto 16px;color:var(--accent,#e5a327)}
      .startup-ring{position:absolute;inset:0;width:180px;height:180px;transform:rotate(-90deg)}
      .startup-ring circle{transition:stroke-dashoffset .18s ease}
      .startup-spectrum{position:absolute;left:16px;top:63px;width:148px;height:54px}
      .startup-spectrum path{stroke-dasharray:320;stroke-dashoffset:320;animation:startup-line 1s ease-in-out infinite alternate}
      .startup p{font-size:13px;margin:0;color:var(--muted,#717680)}
      .startup .startup-greeting{margin:12px 0 0;font-size:14px;font-weight:500;color:inherit}
      .startup button{margin-top:18px;min-height:36px;padding:7px 16px;border:1px solid var(--border,#ddd);border-radius:7px;background:var(--panel,#fff);color:inherit;font:inherit;cursor:pointer}
      .startup [hidden]{display:none!important}
      .startup[data-phase=leaving]{opacity:0}
      .startup[data-phase=error] .startup-spectrum path{animation:none;stroke-dashoffset:0}
      .startup[data-phase=error] .startup-ring circle{transition:none}
      @keyframes startup-line{to{stroke-dashoffset:0}}
      @media(prefers-reduced-motion:reduce){.startup,.startup-spectrum path,.startup-ring circle,#app{animation:none!important;transition:none!important}.startup-spectrum path{stroke-dashoffset:0}}
      :root[data-reduced-motion=true] .startup,:root[data-reduced-motion=true] .startup-spectrum path,:root[data-reduced-motion=true] .startup-ring circle,:root[data-reduced-motion=true] #app{animation:none!important;transition:none!important}
      :root[data-reduced-motion=true] .startup-spectrum path{stroke-dashoffset:0}
    </style>
  </head>
  <body>
    <div id="startup" class="startup" data-phase="loading" role="status" aria-live="polite"><div><strong>SimLIBS</strong><p id="startup-greeting" class="startup-greeting">夜深人静了，早点休息。</p><div id="startup-progress" class="startup-visual" role="progressbar" aria-label="界面初始化节点进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><svg class="startup-ring" viewBox="0 0 200 200" fill="none" aria-hidden="true"><circle id="startup-ring" cx="100" cy="100" r="86" pathLength="100" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="100" style="visibility:hidden" /></svg><svg class="startup-spectrum" viewBox="0 0 180 54" fill="none" aria-hidden="true"><path d="M2 40h24l8-20 9 26 13-39 12 33h24l7-14 7 14h24l8-23 9 23h31" stroke="currentColor" stroke-width="2" stroke-linejoin="round" /></svg></div><p id="startup-message">正在准备工作台</p><button id="startup-retry" type="button" hidden>重新载入</button></div></div>
    <div id="app" inert aria-hidden="true" aria-busy="true"></div>
    <script>
      (() => {
        const hour=new Date().getHours();document.getElementById('startup-greeting').textContent=hour>=6&&hour<11?'早上好，开启新的一天。':hour>=11&&hour<14?'午安，记得适时休息。':hour>=14&&hour<18?'下午好，愿今天进展顺利。':'夜深人静了，早点休息。';
        const root=document.documentElement, splash=document.getElementById('startup'), app=document.getElementById('app'), message=document.getElementById('startup-message'), retry=document.getElementById('startup-retry');
        try { const p=JSON.parse(localStorage.getItem('simlibs-vue-preferences-v1')||'{}'); root.dataset.theme=p.mode==='dark'||p.mode==='system'&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';root.dataset.reducedMotion=String(p.reducedMotion===true); } catch {}
        let phase='loading',initialized=false,finishTimer,fadeTimer;const startedAt=performance.now();
        const progressbar=document.getElementById('startup-progress'),ring=document.getElementById('startup-ring'),nodes=['module','mounted','fonts'];let completed=0,progress=0;
        const renderProgress=value=>{progress=value;progressbar.setAttribute('aria-valuenow',String(value));ring.style.visibility=value?'visible':'hidden';ring.style.strokeDashoffset=String(100-value);};
        const step=node=>{if(phase!=='loading'||initialized||completed>=nodes.length||nodes[completed]!==node)return;completed++;renderProgress(completed*25);};
        const fail=()=>{if(phase!=='loading')return;phase='error';clearTimeout(watchdog);clearTimeout(finishTimer);clearTimeout(fadeTimer);splash.dataset.phase='error';message.textContent='界面未能载入，请重新载入。';retry.hidden=false;};
        const watchdog=setTimeout(fail,8000);
        const ready=()=>{if(initialized||phase!=='loading'||completed!==nodes.length)return;initialized=true;phase='ready';renderProgress(100);clearTimeout(watchdog);const reduced=root.dataset.reducedMotion==='true'||matchMedia('(prefers-reduced-motion: reduce)').matches;const remaining=Math.max(0,(reduced?140:900)-(performance.now()-startedAt))+1000;finishTimer=setTimeout(()=>{if(phase!=='ready')return;splash.dataset.phase='leaving';document.body.dataset.bootReady='true';fadeTimer=setTimeout(()=>{app.removeAttribute('inert');app.removeAttribute('aria-hidden');app.setAttribute('aria-busy','false');splash.remove();},reduced?0:180);},remaining);};
        retry.addEventListener('click',()=>location.reload());window.addEventListener('error',fail);window.addEventListener('unhandledrejection',fail);
        window.__SIMLIBS_BOOT__={step,ready,fail,get phase(){return phase;},get progress(){return progress;},startedAt};
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
